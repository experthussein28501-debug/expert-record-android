name: Import Source ZIP

on:
  push:
    branches: [ "main" ]
    paths:
      - "khabir-integrated-0.9.2-work-minutes.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="khabir-integrated-0.9.2-work-minutes.zip"
          TMP="$RUNNER_TEMP/khabir-import"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          TOP_COUNT="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [ "$TOP_COUNT" -eq 1 ]; then
            SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          else
            SRC="$TMP"
          fi

          rsync -a             --exclude ".git/"             --exclude ".github/"             --exclude ".gitignore"             "$SRC/" ./

          rm -f "$ZIP"

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "import: khabir integrated 0.9.2 source"
          git push
