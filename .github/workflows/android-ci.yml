name: Android CI
# Build and device checks run only after functional and security tests pass.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Import Source ZIP" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "**/*.xml"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ "main" ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Backend dependencies, tests and audit
        working-directory: backend/functions
        run: |
          npm ci --ignore-scripts --no-fund
          npm run check
          npm test
          npm audit --omit=dev --audit-level=moderate

      - name: Security gate regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Functional unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PKHABIR_SKIP_SCREENSHOT_TESTS=true \
            :core:testDebugUnitTest \
            :feature-auth:testDebugUnitTest \
            :feature-cases:testDebugUnitTest \
            :feature-notifications:testDebugUnitTest \
            :feature-reports:testDebugUnitTest \
            :feature-agenda:testDebugUnitTest \
            :app:testCombinedDebugUnitTest

      - name: Render Word regression fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-hosny-amiri poppler-utils
          mkdir -p document-evidence
          libreoffice -env:UserInstallation=file:///tmp/expert-word-render --headless --convert-to pdf --outdir document-evidence core/build/visual-evidence/work-minutes-long.docx
          pdftoppm -scale-to 1400 -png document-evidence/work-minutes-long.pdf document-evidence/minutes
      - name: Upload functional and document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-functional-evidence
          path: |
            **/build/test-results/
            core/build/visual-evidence/
            document-evidence/
          retention-days: 7

  apk:
    needs: tests
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build optimized non-debuggable APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleCombinedHardened

      - name: Verify APK security properties
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/combined/hardened -name '*.apk' | head -n 1)"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$ANALYZER" manifest print "$APK" > /tmp/khabir-manifest.xml
          python3 scripts/verify_apk_security.py "$APK" /tmp/khabir-manifest.xml app/build/outputs/mapping/combinedHardened/mapping.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          python3 scripts/verify_play_assets.py "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"

      - name: Export exact source and evidence
        run: |
          git archive --format=zip --prefix=expert-record-0.9.10/ --output=expert-record-0.9.10-source.zip HEAD
          cp /tmp/khabir-manifest.xml release-manifest.xml
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$(find app/build/outputs/apk/combined/hardened -name '*.apk' | head -n 1)" > signing-fingerprint.txt

      - name: Prepare chat APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" expert-record-0.9.10-hardened.apk

      - name: Upload APK for chat transfer
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-chat-download
          path: |
            expert-record-0.9.10-hardened.apk
            expert-record-0.9.10-source.zip
            release-manifest.xml
            signing-fingerprint.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  device:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime OCR and agenda checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew --no-daemon :app:connectedCombinedDebugAndroidTest; result=$?; adb pull /sdcard/Download/expert-record-ui ui-evidence || true; exit "$result"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-runtime-evidence
          path: |
            ui-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
