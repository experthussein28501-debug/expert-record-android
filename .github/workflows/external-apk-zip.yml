name: External APK ZIP

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/external-apk-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download verified APK from signed CDN
        shell: bash
        run: |
          set -euo pipefail
          URL='https://release-assets.githubusercontent.com/github-production-release-asset/1373448064/a5d795c2-4426-4b8f-85c0-01e3ad556433?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-17T05%3A32%3A37Z&rscd=attachment%3B+filename%3Dexpert-record-debug.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-17T04%3A31%3A53Z&ske=2026-09-17T05%3A32%3A37Z&sks=b&skv=2018-11-09&sig=eNJpOt5E42CEmKh8hXK6pGWgs%2BUtLSOXSBeKs%2FkvrLo%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4OTYyMjYxNywibmJmIjoxNzg5NjIwODE3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.SAMNGaA97y5_TvXndP54E8Llwl5gYGtWQNLreNqKlw0&response-content-disposition=attachment%3B%20filename%3Dexpert-record-debug.apk&response-content-type=application%2Fvnd.android.package-archive'
          curl -L --fail --retry 2 --max-time 180 "$URL" -o expert-record-debug.apk
          SIZE="$(stat -c%s expert-record-debug.apk)"
          echo "APK_SIZE=$SIZE"
          test "$SIZE" -eq 49930149

      - name: Zip and verify
        shell: bash
        run: |
          set -euo pipefail
          zip -9 expert-record-0.9.2-fixed.zip expert-record-debug.apk
          unzip -t expert-record-0.9.2-fixed.zip
          echo "APK_SHA256=$(sha256sum expert-record-debug.apk | awk '{print $1}')"
          echo "ZIP_SHA256=$(sha256sum expert-record-0.9.2-fixed.zip | awk '{print $1}')"
          echo "ZIP_SIZE=$(stat -c%s expert-record-0.9.2-fixed.zip)"

      - name: Upload ZIP to alternate host
        shell: bash
        run: |
          set -euo pipefail
          FILE='expert-record-0.9.2-fixed.zip'
          URL="$(curl -sS --fail --max-time 240 \
            -F 'reqtype=fileupload' \
            -F "fileToUpload=@${FILE}" \
            https://catbox.moe/user/api.php)"
          echo "UPLOAD_RESPONSE=$URL"
          printf '%s' "$URL" | grep -Eq '^https://'
          echo "DIRECT_ZIP_URL=$URL"
