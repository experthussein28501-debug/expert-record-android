name: Verify APK Release Asset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify latest private APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev-latest" \
            --jq '.assets[] | select(.name == "expert-record-debug.apk") | .id' | head -n1)"
          test -n "$ASSET_ID"
          echo "APK_ASSET_ID=$ASSET_ID"
          gh release download dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "expert-record-debug.apk" \
            --output expert-record-debug.apk
          test -s expert-record-debug.apk
          sha256sum expert-record-debug.apk
          ls -lh expert-record-debug.apk
          echo "Private release asset verified."
