name: Android CI
# Functional tests and installable APK build run independently so one failure
# does not hide the next actionable build problem.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Import Source ZIP" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "**/*.xml"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ "main" ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Security gate regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Functional unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PKHABIR_SKIP_SCREENSHOT_TESTS=true \
            :core:testDebugUnitTest \
            :feature-auth:testDebugUnitTest \
            :feature-cases:testDebugUnitTest \
            :feature-notifications:testDebugUnitTest \
            :feature-reports:testDebugUnitTest \
            :feature-agenda:testDebugUnitTest \
            :app:testCombinedDebugUnitTest

  apk:
    needs: tests
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build optimized non-debuggable APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleCombinedHardened

      - name: Verify APK security properties
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/combined/hardened -name '*.apk' | head -n 1)"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$ANALYZER" manifest print "$APK" > /tmp/khabir-manifest.xml
          python3 scripts/verify_apk_security.py "$APK" /tmp/khabir-manifest.xml app/build/outputs/mapping/combinedHardened/mapping.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"

      - name: Prepare chat APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" expert-record-0.9.8-hardened.apk

      - name: Upload APK for chat transfer
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-chat-download
          path: expert-record-0.9.8-hardened.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

