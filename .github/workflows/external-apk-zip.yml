name: External APK ZIP

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/external-apk-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download current published APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'expert-record-debug.apk' \
            --output expert-record-debug.apk
          SIZE="$(stat -c%s expert-record-debug.apk)"
          echo "APK_SIZE=$SIZE"
          test "$SIZE" -gt 49000000
          echo "APK_SHA256=$(sha256sum expert-record-debug.apk | awk '{print $1}')"

      - name: Zip and verify
        shell: bash
        run: |
          set -euo pipefail
          FILE='expert-record-0.9.3-work-minutes-complete.zip'
          zip -9 "$FILE" expert-record-debug.apk
          unzip -t "$FILE"
          echo "ZIP_SHA256=$(sha256sum "$FILE" | awk '{print $1}')"
          echo "ZIP_SIZE=$(stat -c%s "$FILE")"

      - name: Upload ZIP with fallbacks
        shell: bash
        run: |
          set -euo pipefail
          FILE='expert-record-0.9.3-work-minutes-complete.zip'
          URL=''

          echo 'Trying Litterbox...'
          URL="$(curl -sS --fail --max-time 300 \
            -F 'reqtype=fileupload' \
            -F 'time=24h' \
            -F "fileToUpload=@${FILE}" \
            https://litterbox.catbox.moe/resources/internals/api.php || true)"
          if ! printf '%s' "$URL" | grep -Eq '^https?://'; then URL=''; fi

          if [ -z "$URL" ]; then
            echo 'Trying transfer.sh...'
            URL="$(curl -sS --fail --max-time 300 --upload-file "$FILE" "https://transfer.sh/$FILE" || true)"
            if ! printf '%s' "$URL" | grep -Eq '^https?://'; then URL=''; fi
          fi

          if [ -z "$URL" ]; then
            echo 'Trying 0x0.st...'
            URL="$(curl -sS --fail --max-time 300 -F "file=@${FILE}" https://0x0.st || true)"
            if ! printf '%s' "$URL" | grep -Eq '^https?://'; then URL=''; fi
          fi

          test -n "$URL"
          echo "DIRECT_ZIP_URL=$URL"
