name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload keystore
        env:
          KHABIR_KEYSTORE_BASE64: ${{ secrets.KHABIR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KHABIR_KEYSTORE_BASE64"
          echo "$KHABIR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/expert-record-upload.jks"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed APK and AAB
        env:
          ORG_GRADLE_PROJECT_KHABIR_UPLOAD_STORE_FILE: ${{ runner.temp }}/expert-record-upload.jks
          ORG_GRADLE_PROJECT_KHABIR_UPLOAD_STORE_PASSWORD: ${{ secrets.KHABIR_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KHABIR_UPLOAD_KEY_ALIAS: ${{ secrets.KHABIR_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KHABIR_UPLOAD_KEY_PASSWORD: ${{ secrets.KHABIR_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_KHABIR_GEMINI_VISION_ENDPOINT: ${{ secrets.KHABIR_GEMINI_VISION_ENDPOINT }}
          ORG_GRADLE_PROJECT_KHABIR_FIREBASE_API_KEY: ${{ secrets.KHABIR_FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_KHABIR_FIREBASE_APP_ID: ${{ secrets.KHABIR_FIREBASE_APP_ID }}
          ORG_GRADLE_PROJECT_KHABIR_FIREBASE_PROJECT_ID: ${{ secrets.KHABIR_FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_KHABIR_GOOGLE_WEB_CLIENT_ID: ${{ secrets.KHABIR_GOOGLE_WEB_CLIENT_ID }}
          ORG_GRADLE_PROJECT_KHABIR_ACTIVATION_ENDPOINT: ${{ secrets.KHABIR_ACTIVATION_ENDPOINT }}
        run: |
          ./gradlew --no-daemon :app:assembleCombinedRelease :app:bundleCombinedRelease

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-combined-release
          path: |
            app/build/outputs/apk/combined/release/*.apk
            app/build/outputs/bundle/combinedRelease/*.aab
          if-no-files-found: error
          retention-days: 30
