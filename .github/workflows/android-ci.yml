name: Android CI

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Import Source ZIP" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "**/*.xml"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Build combined debug APK
        run: ./gradlew --no-daemon :app:assembleCombinedDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-combined-debug
          path: app/build/outputs/apk/combined/debug/*.apk
          if-no-files-found: error
          retention-days: 14
