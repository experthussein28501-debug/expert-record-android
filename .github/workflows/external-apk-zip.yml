name: Package APK ZIP (Private)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download current private APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'expert-record-debug.apk' \
            --output expert-record-debug.apk
          SIZE="$(stat -c%s expert-record-debug.apk)"
          echo "APK_SIZE=$SIZE"
          test "$SIZE" -gt 10000000
          sha256sum expert-record-debug.apk

      - name: Zip and verify
        shell: bash
        run: |
          set -euo pipefail
          FILE='expert-record-0.9.11-debug.zip'
          rm -f "$FILE"
          zip -9 "$FILE" expert-record-debug.apk
          unzip -t "$FILE"
          sha256sum "$FILE"
          ls -lh expert-record-debug.apk "$FILE"

      - name: Attach ZIP to private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE='expert-record-0.9.11-debug.zip'
          gh release upload dev-latest "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
