name: Android CI

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Import Source ZIP" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "**/*.xml"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ "main" ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Functional unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PKHABIR_SKIP_SCREENSHOT_TESTS=true \
            :core:testDebugUnitTest \
            :feature-auth:testDebugUnitTest \
            :feature-cases:testDebugUnitTest \
            :feature-notifications:testDebugUnitTest \
            :feature-reports:testDebugUnitTest \
            :feature-agenda:testDebugUnitTest \
            :app:testCombinedDebugUnitTest

      - name: Build combined debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleCombinedDebug

      - name: Prepare chat APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" expert-record-0.9.11-debug.apk
          sha256sum expert-record-0.9.11-debug.apk
          ls -lh expert-record-0.9.11-debug.apk

      - name: Upload APK for chat transfer
        uses: actions/upload-artifact@v4
        with:
          name: expert-record-0.9.11-chat-download
          path: expert-record-0.9.11-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish latest debug APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest expert-record-0.9.11-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Expert Record 0.9.11 - Latest Debug APK" \
            --notes "Automated verified debug build from main." \
            --prerelease
