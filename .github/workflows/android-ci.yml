name: Android CI
# Functional tests and installable APK build run independently so one failure
# does not hide the next actionable build problem.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Import Source ZIP" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "**/*.xml"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ "main" ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Functional unit tests
        run: |
          ./gradlew --no-daemon -PKHABIR_SKIP_SCREENSHOT_TESTS=true \
            :core:testDebugUnitTest \
            :feature-auth:testDebugUnitTest \
            :feature-cases:testDebugUnitTest \
            :feature-notifications:testDebugUnitTest \
            :feature-reports:testDebugUnitTest \
            :app:testCombinedDebugUnitTest

  apk:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build combined debug APK
        run: ./gradlew --no-daemon :app:assembleCombinedDebug

      - name: Publish latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" expert-record-debug.apk
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest expert-record-debug.apk             --target "$GITHUB_SHA"             --title "Expert Record - Latest Debug APK"             --notes "Automated debug build from main."             --prerelease
