name: Package APK ZIP

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/package-apk-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Download latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "expert-record-debug.apk" \
            --clobber
          test -f expert-record-debug.apk
          test "$(stat -c%s expert-record-debug.apk)" -gt 49000000

      - name: Package APK as ZIP
        run: |
          set -euo pipefail
          rm -f expert-record-0.9.2-fixed.zip
          zip -9 expert-record-0.9.2-fixed.zip expert-record-debug.apk
          unzip -t expert-record-0.9.2-fixed.zip
          sha256sum expert-record-debug.apk expert-record-0.9.2-fixed.zip
          ls -lh expert-record-debug.apk expert-record-0.9.2-fixed.zip

      - name: Upload ZIP to current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload dev-latest expert-record-0.9.2-fixed.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
